<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>午睡黑洞 · 午睡舱 · 奶蛙.space</title>
<meta name="description" content="午睡黑洞是一个让你慢下来的地方。选 10、20 或 30 分钟，奶蛙在黑洞边上陪你打个盹；睡醒时，外面已经过去了几百年。">
<meta name="theme-color" content="#02030a">
<meta property="og:title" content="午睡黑洞 · 午睡舱">
<meta property="og:description" content="奶蛙蜷在黑洞的吸积盘上打呼。你也睡一会儿吧。">
<meta property="og:image" content="../naiwa.png">
<link rel="icon" href="../naiwa.png">
<link rel="modulepreload" href="../daidai/lib/three.bundle.js">
<style>
  :root {
    --space: #02030a; --text: #f5f5f7; --muted: #c4c4d4; --faint: #8a8aa3;
    --glass: rgba(14, 16, 32, .55); --line: rgba(255,255,255,.16);
    --gold-a: #ff9f0a; --gold-b: #ffd60a; --milk: #f3dcae; --violet: #8e7dff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--space); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.01em; user-select: none; -webkit-user-select: none; }
  a { color: inherit; text-decoration: none; }
  rt { font-size: .5em; opacity: .8; letter-spacing: 0; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  [hidden] { display: none !important; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .grad { background: linear-gradient(90deg, var(--gold-a), var(--gold-b) 55%, var(--milk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glass { background: var(--glass); backdrop-filter: saturate(160%) blur(18px); -webkit-backdrop-filter: saturate(160%) blur(18px); border: 1px solid var(--line); }
  .pill { border-radius: 980px; }
  .ic { width: 1.25em; height: 1.25em; display: block; overflow: visible; flex: none; }
  .icw { display: inline-flex; align-items: center; }
  .hud { position: fixed; z-index: 10; }

  /* ---------- the frog on the disc ---------- */
  #frogWrap { position: fixed; z-index: 3; left: 0; top: 0; width: 0; height: 0; pointer-events: none; will-change: transform; }
  #frog { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; pointer-events: auto; cursor: pointer; }
  #frog .pose { width: calc(var(--h) * .57); height: var(--h); margin-left: calc(var(--h) * -.285); transition: transform 1.6s cubic-bezier(.5, 0, .2, 1); transform-origin: 50% 50%; }
  #frog img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)) saturate(.95); pointer-events: none; -webkit-user-drag: none; }
  #frog.awake .pose { animation: sway 5s ease-in-out infinite; }
  #frog.asleep .pose { transform: translateY(calc(var(--h) * .215)) rotate(90deg); }
  #frog.asleep { animation: breathe 10s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(1.03, 1.05); } }
  #frog.poke .pose { animation: poke .5s ease; }
  @keyframes poke { 30% { transform: scale(1.08, .92); } 60% { transform: scale(.96, 1.05); } }
  #zzz { position: absolute; left: calc(var(--h) * .35); bottom: calc(var(--h) * .55); width: 0; height: 0; opacity: 0; transition: opacity 1.4s; }
  #frogWrap.asleep #zzz { opacity: 1; }
  #zzz b { position: absolute; left: 0; bottom: 0; font-size: calc(var(--h) * .14); font-weight: 800; color: #d9d2ff; text-shadow: 0 0 12px rgba(142,125,255,.8); opacity: 0; animation: zzz 4.2s ease-in infinite; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  #zzz b:nth-child(2) { animation-delay: 1.4s; font-size: calc(var(--h) * .1); } #zzz b:nth-child(3) { animation-delay: 2.8s; font-size: calc(var(--h) * .17); }
  @keyframes zzz { 0% { transform: translate(0, 0) rotate(-8deg) scale(.6); opacity: 0; } 15% { opacity: .95; } 100% { transform: translate(calc(var(--h) * .22), calc(var(--h) * -.55)) rotate(10deg) scale(1.15); opacity: 0; } }

  /* breathing guide: a ring in the shadow that grows on the in-breath */
  #breath { position: fixed; z-index: 2; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
  #breath.on { opacity: 1; }
  #breath .ring { position: absolute; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; border: 1.5px solid rgba(255,230,160,.55); box-shadow: 0 0 24px rgba(255,200,90,.25), inset 0 0 24px rgba(255,200,90,.12); transform: scale(.84); will-change: transform; }
  .btxt { font-size: 13px; letter-spacing: .32em; color: rgba(255,230,160,.85); text-indent: .32em; margin-bottom: 4px; min-height: 18px; }

  /* ---------- top bars ---------- */
  .tl { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .back { font-size: 13px; padding: 7px 14px; opacity: .9; }
  .title { padding: 10px 16px 9px; border-radius: 18px; }
  .title b { display: block; font-size: 16px; font-weight: 800; }
  .title .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tr { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); display: flex; gap: 4px; padding: 4px; }
  .tr a { font-size: 12.5px; padding: 6px 12px; border-radius: 980px; color: var(--muted); }
  .tr a.on { background: rgba(255,255,255,.14); color: var(--text); font-weight: 700; }
  body.deep .tl, body.deep .tr { opacity: .0; pointer-events: none; }
  .tl, .tr { transition: opacity 1.2s; }

  /* ---------- bottom dock ---------- */
  #dock { left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100vw - 20px), 660px); display: flex; flex-direction: column; gap: 10px; align-items: stretch; transition: opacity 1.4s; }
  body.deep #dock .keep { opacity: .22; } body.deep #dock .keep:hover { opacity: 1; }
  .card { border-radius: 26px; padding: 14px 16px; transition: opacity 1s; }
  .h4 { font-size: 11px; letter-spacing: .22em; color: var(--gold-b); font-weight: 700; margin: 0 0 8px; text-transform: uppercase; }
  .seg { display: flex; padding: 4px; gap: 2px; width: max-content; }
  .seg button { padding: 8px 18px; font-size: 14px; font-weight: 700; border-radius: 980px; color: var(--muted); transition: background .2s, color .2s; white-space: nowrap; }
  .seg button.on { background: linear-gradient(90deg, var(--gold-a), var(--gold-b)); color: #1d1300; box-shadow: 0 6px 24px rgba(255,180,10,.25); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 6px 12px 6px 8px; border-radius: 980px; background: rgba(255,255,255,.08); border: 1px solid var(--line); display: flex; align-items: center; gap: 6px; transition: background .2s, transform .15s; }
  .chip .ic { width: 20px; height: 20px; }
  .chip:hover { background: rgba(255,255,255,.16); } .chip:active { transform: scale(.96); }
  .chip.on { background: linear-gradient(90deg, var(--gold-a), var(--gold-b)); color: #1d1300; border-color: transparent; font-weight: 700; }
  .chip.on .ic { filter: none; }
  .setup .grid { display: grid; grid-template-columns: auto 1fr; gap: 14px 22px; align-items: start; }
  .vol { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .vol .ic { width: 18px; height: 18px; }
  input[type=range] { flex: 1; accent-color: var(--gold-b); height: 20px; }
  .go { display: block; width: 100%; margin-top: 14px; padding: 13px 20px; border-radius: 980px; font-size: 16px; font-weight: 800; color: #1d1300; background: linear-gradient(90deg, var(--gold-a), var(--gold-b)); box-shadow: 0 10px 34px rgba(255,170,10,.3); display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform .15s, box-shadow .2s; }
  .go:hover { box-shadow: 0 12px 40px rgba(255,170,10,.45); } .go:active { transform: scale(.98); }
  .go .ic { width: 22px; height: 22px; }
  .foot { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }
  label.ck { display: flex; gap: 7px; align-items: center; cursor: pointer; color: var(--muted); }
  label.ck input { accent-color: var(--gold-b); width: 15px; height: 15px; }

  .worry { display: flex; gap: 6px; padding: 6px 6px 6px 14px; align-items: center; }
  .worry input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 14px; user-select: text; -webkit-user-select: text; }
  .worry input::placeholder { color: var(--faint); }
  .worry .ic { width: 22px; height: 22px; }
  .worry button { display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 980px; background: rgba(255,255,255,.1); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .2s; }
  .worry button:hover { background: rgba(255,255,255,.2); }
  .worry button .ic { width: 20px; height: 20px; }
  .count { font-size: 12px; color: var(--faint); text-align: center; min-height: 14px; }

  /* nap card */
  .nap { text-align: center; }
  .nap .left { font-size: 52px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .nap .out { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .nap .out b { color: var(--gold-b); }
  .nap .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .ghost { padding: 8px 16px; border-radius: 980px; background: rgba(255,255,255,.1); font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; transition: background .2s; }
  .ghost:hover { background: rgba(255,255,255,.2); } .ghost .ic { width: 18px; height: 18px; }
  .hint { font-size: 13px; color: var(--muted); padding: 7px 16px; text-align: center; align-self: center; max-width: 100%; transition: opacity .6s; }

  /* ---------- toast ---------- */
  .toast { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 4px); transform: translate(-50%, -30px); z-index: 60; display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 12px; border-radius: 980px; background: rgba(30,30,45,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); font-size: 14px; opacity: 0; transition: opacity .4s, transform .45s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100vw - 32px); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast img { width: 16px; height: 28px; object-fit: contain; }

  /* ---------- the worry noodles ---------- */
  #fx { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
  #fx span { position: absolute; left: 0; top: 0; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 3px #000, 0 0 10px rgba(0,0,0,.9), 0 0 22px rgba(40,10,90,.9); will-change: transform, opacity; white-space: pre; }

  /* ---------- wake-up report ---------- */
  #report { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: radial-gradient(circle at 50% 40%, rgba(40,30,80,.55), rgba(2,3,10,.93)); opacity: 0; transition: opacity 1.2s; }
  #report.show { opacity: 1; }
  .rcard { width: min(560px, 100%); border-radius: 30px; padding: 26px 26px 22px; text-align: center; background: rgba(10, 12, 26, .66); box-shadow: 0 30px 80px rgba(0,0,0,.5); max-height: 100%; overflow-y: auto; }
  .rcard .eyebrow { font-size: 12px; letter-spacing: .3em; color: var(--gold-b); font-weight: 700; }
  .rcard h2 { font-size: clamp(26px, 6vw, 36px); line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 4px; }
  .rcard .big { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .rcard canvas { width: 200px; height: 200px; display: block; margin: 6px auto 0; }
  .rcard .yrs { font-size: 13px; color: var(--gold-b); font-variant-numeric: tabular-nums; margin: -2px 0 12px; letter-spacing: .12em; }
  .rcard ul { list-style: none; text-align: left; display: flex; flex-direction: column; gap: 8px; margin: 6px 0 16px; }
  .rcard li { font-size: 14px; line-height: 1.5; color: var(--muted); padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); opacity: 0; transform: translateY(8px); transition: opacity .7s, transform .7s; }
  .rcard li.show { opacity: 1; transform: none; }
  .rcard li b { color: var(--text); }
  .rcard .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .rcard .row .go { width: auto; margin: 0; padding: 11px 24px; font-size: 15px; }
  .rcard .row .ghost { padding: 11px 20px; font-size: 14px; }

  /* ---------- falling dream ---------- */
  #veil { position: fixed; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  #veil.on { opacity: 1; }
  #hurt { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0; box-shadow: inset 0 0 160px 40px rgba(255,60,80,.7); transition: opacity .6s; }
  #hurt.on { opacity: 1; transition: none; }
  #dreamHud { position: fixed; inset: 0; z-index: 11; pointer-events: none; }
  #dreamHud > * { pointer-events: auto; }
  .dtop { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .dstat { display: flex; gap: 14px; align-items: center; padding: 8px 16px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dstat .ic { width: 22px; height: 22px; } .dstat span { display: inline-flex; align-items: center; gap: 4px; }
  .dstat .hearts { gap: 2px; }
  .dexit { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
  .dgauge { position: absolute; right: max(18px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); height: min(46vh, 320px); width: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: visible; }
  .dgauge i { position: absolute; left: 0; top: 0; width: 100%; border-radius: 3px; background: linear-gradient(180deg, #fff3b0, #ff9f0a); }
  .dgauge em { position: absolute; right: 14px; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--gold-b); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dmsg { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 18px; font-size: 14px; color: var(--muted); text-align: center; transition: opacity .8s; max-width: calc(100vw - 24px); }
  #bed { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 38%, #ffe6b8, #f0b27a 55%, #b6746a); color: #4a2a1c; opacity: 0; transition: opacity 1.6s; text-align: center; overflow-y: auto; }
  #bed.show { opacity: 1; }
  #bed .scene { position: relative; width: min(440px, 90vw); }
  #bed svg.bedsvg { width: 100%; height: auto; display: block; }
  #bed .froggy { position: absolute; left: 9%; top: 41%; width: 64%; height: auto; transform: translateY(-50%) rotate(-90deg) scaleX(-1) scale(.58); transform-origin: 50% 50%; filter: drop-shadow(0 6px 10px rgba(80,40,10,.35)); animation: bedb 6s ease-in-out infinite; }
  @keyframes bedb { 0%, 100% { transform: translateY(-50%) rotate(-90deg) scaleX(-1) scale(.58); } 50% { transform: translateY(-50%) rotate(-90deg) scaleX(-1) scale(.6); } }
  #bed h2 { font-size: clamp(24px, 6vw, 34px); font-weight: 800; letter-spacing: -.02em; margin: 14px 0 6px; }
  #bed p { font-size: 15px; line-height: 1.6; max-width: 420px; margin: 0 auto 16px; color: #6a4030; }
  #bed .go { width: auto; margin: 0 auto; padding: 12px 28px; background: #4a2a1c; color: #ffe6b8; box-shadow: 0 10px 30px rgba(74,42,28,.35); }
  #bed .z { position: absolute; font-weight: 800; color: #fff8e6; animation: zzz2 4s ease-in infinite; opacity: 0; font-family: ui-rounded, system-ui, sans-serif; }
  @keyframes zzz2 { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(30px,-80px) scale(1.3); opacity: 0; } }

  @media (max-width: 760px) {
    .setup .grid { grid-template-columns: 1fr; gap: 10px; }
    .seg button { padding: 8px 14px; }
    .nap .left { font-size: 44px; }
    .title .sub { max-width: 160px; }
    .tr a { padding: 6px 9px; }
    .dgauge { display: none; }
    .setup .foot > span { display: none; }
  }
  @media (max-height: 620px) { .hint { display: none; } .setup .foot { display: none; } .go { margin-top: 10px; padding: 10px 20px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="午睡黑洞"></canvas>

<div id="breath"><div class="ring"></div></div>
<div id="frogWrap"><div id="frog" class="awake"><div class="pose"><img src="../naiwa.png" alt="奶蛙" draggable="false"></div><div id="zzz"><b>Z</b><b>z</b><b>Z</b></div></div></div>
<div id="fx"></div>

<div class="hud tl">
  <a class="back glass pill" id="back" href="../" data-i18n>‹ 奶蛙宇宙</a>
  <div class="title glass"><b class="grad" data-i18n>午睡黑洞</b><div class="sub" id="sub"></div></div>
</div>
<div class="hud tr glass pill" id="langs"><a href="?lang=zh" data-lang="zh">中文</a><a href="?lang=en" data-lang="en">EN</a><a href="?lang=ja" data-lang="ja">日本語</a></div>

<div class="hud" id="dock">
  <div class="hint glass pill keep" id="hint"></div>
  <div class="worry glass pill keep" id="worry">
    <span class="icw" data-ic="swirl"></span>
    <input id="worryIn" type="text" maxlength="40" autocomplete="off" spellcheck="false" data-ph="把烦心事打在这里，丢进黑洞">
    <button type="button" id="worryGo"><span class="icw" data-ic="send"></span><span data-i18n>丢进去</span></button>
  </div>
  <div class="count keep" id="worryCount"></div>

  <section class="card glass setup" id="setup">
    <div class="grid">
      <div>
        <div class="h4" data-i18n>小睡多久</div>
        <div class="seg glass pill" id="dur"></div>
      </div>
      <div id="soundBlock">
        <div class="h4" data-i18n>背景声音</div>
        <div class="chips" id="sounds"></div>
        <div class="vol"><span class="icw" data-ic="sound"></span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.6"></div>
      </div>
    </div>
    <button class="go" id="start" type="button"><span class="icw" data-ic="moon"></span><span data-i18n>开始午睡</span></button>
    <div class="foot"><label class="ck"><input type="checkbox" id="chimeCk" checked><span data-i18n>时间到了，轻轻叫醒我</span></label><span data-i18n>黑洞里的 1 分钟 ≈ 外面的 15 年</span></div>
  </section>

  <section class="card glass nap keep" id="nap" hidden>
    <div class="btxt" id="breathTxt"></div>
    <div class="left" id="left">20:00</div>
    <div class="out" id="out"></div>
    <div class="row" id="napSound"></div>
    <div class="row"><button class="ghost" id="wake" type="button"><span class="icw" data-ic="sun"></span><span data-i18n>提前醒来</span></button></div>
  </section>
</div>

<div id="dreamHud" hidden>
  <div class="dtop">
    <div class="dstat glass pill"><span class="hearts" id="hearts"></span><span><svg class="ic"><use href="#i-shard"/></svg><b id="shardN">0</b></span></div>
  </div>
  <button class="dexit ghost glass" id="dwake" type="button"><span class="icw" data-ic="sun"></span><span data-i18n>醒来</span></button>
  <div class="dgauge"><i id="gaugeFill"></i><em id="depthTxt"></em></div>
  <div class="dmsg glass pill" id="dmsg"></div>
</div>
<div id="hurt"></div>

<div id="report" hidden>
  <div class="rcard glass">
    <p class="eyebrow" data-i18n>睡醒了</p>
    <h2 class="grad" id="rTitle"></h2>
    <p class="big" id="rBig"></p>
    <canvas id="rCanvas" width="400" height="400"></canvas>
    <div class="yrs" id="rYears"></div>
    <ul id="rList"></ul>
    <div class="row"><button class="go" id="again" type="button"><span class="icw" data-ic="moon"></span><span data-i18n>再睡一会儿</span></button><button class="ghost" id="rise" type="button"><span class="icw" data-ic="sun"></span><span data-i18n>起床</span></button></div>
  </div>
</div>

<div id="bed" hidden>
  <div class="scene">
    <svg class="bedsvg" viewBox="0 0 440 300" aria-hidden="true">
      <defs><linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2e8"/><stop offset="1" stop-color="#b86bff"/></linearGradient></defs>
      <rect x="20" y="190" width="400" height="26" rx="10" fill="#a47a5a"/>
